
<!DOCTYPE html>
<html>

<head>
    <title>Students</title>
</head>

<body>

    <h1>Student Details</h1>

    <table border="1">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Department</th>
            <th>Email</th>
            <th>Action</th>
        </tr>

        {% for student in students %}

        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
            <td>{{ student[4] }}</td>

            <td>
                <a href="/update/{{ student[0] }}">
                    <button>Update</button>
                </a>

                <a href="/delete/{{ student[0] }}">
                    <button>Delete</button>
                </a>
            </td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/">
        <button>Home</button>
    </a>

</body>

</html>
