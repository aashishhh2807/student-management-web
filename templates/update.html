
<!DOCTYPE html>
<html>

<head>
    <title>Update Student</title>
</head>

<body>

    <h1>Update Student</h1>

    <form action="/update/{{ student[0] }}" method="POST">

        <label>Name:</label>
        <input type="text" name="name" value="{{ student[1] }}" required>

        <br><br>

        <label>Age:</label>
        <input type="number" name="age" value="{{ student[2] }}" required>

        <br><br>

        <label>Department:</label>
        <input type="text" name="dept" value="{{ student[3] }}" required>

        <br><br>

        <label>Email:</label>
        <input type="email" name="email" value="{{ student[4] }}" required>

        <br><br>

        <button type="submit">Update Student</button>

    </form>

    <br>

    <a href="/students">
        <button>Back</button>
    </a>

</body>

</html>
